[package]
name = "ytdlp2strm"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde_json = "1"
m3u8-rs = "6"
tokio-cron-scheduler = "0.15"
chrono = "0.4"
base64 = "0.23"
